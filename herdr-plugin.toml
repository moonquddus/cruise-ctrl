id = "cruise-ctrl"
name = "Cruise Ctrl"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Answer Claude Code permission prompts with 1. Yes in all panes"
platforms = ["macos", "linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "plugin/approve.py"]

[[panes]]
id = "settings"
title = "Cruise Ctrl Settings"
placement = "popup"
command = ["plugin/settings.sh"]

[[panes]]
id = "log"
title = "Cruise Ctrl Log"
placement = "popup"
command = ["plugin/log.sh"]

[[actions]]
id = "settings"
title = "Cruise Ctrl: Settings"
contexts = ["global"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin cruise-ctrl --entrypoint settings --focus"]

[[actions]]
id = "log"
title = "Cruise Ctrl: Show Log"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin cruise-ctrl --entrypoint log --focus"]
